<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Experiments</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font:15px system-ui;background:#0b1220;color:#e5edf8;margin:0}main{max-width:1180px;margin:auto;padding:32px 20px}h1{font-size:32px}p,small{color:#9eafc5}.panel{background:#151f30;border:1px solid #293950;border-radius:12px;padding:18px;margin:16px 0}select{background:#26354b;color:white;border:1px solid #4b6080;padding:9px;border-radius:8px}table{border-collapse:collapse;width:100%;overflow:auto}th,td{text-align:right;padding:11px;border-bottom:1px solid #293950}th:first-child,td:first-child{text-align:left}a{color:#93c5fd}.scroll{overflow-x:auto}</style></head><body><main><h1>Stock Experiments</h1><p>Overnight · Intraday · Buy & Hold | Historical research, not investment advice</p><div class="panel"><label>Ticker <select id="ticker"></select></label> <span id="meta"></span></div><div class="panel"><h2>Growth of $10,000</h2><div id="chart"></div></div><div class="panel scroll"><h2>Performance comparison</h2><table id="results"><thead><tr><th>Strategy</th><th>Total return</th><th>Annualized</th><th>Volatility</th><th>Sharpe (0% RF)</th><th>Max drawdown</th><th>Win rate</th></tr></thead><tbody></tbody></table></div><p id="errors"></p><p><a href="data/summary.csv">Download all results (CSV)</a> · <a href="https://github.com/siddarthamuppalla/stock-experiment/actions">Run a new backtest</a></p></main><script>
const pct=x=>(x*100).toFixed(2)+'%';let data;
function render(){let t=document.querySelector('#ticker').value;let traces=Object.entries(data.series[t]).map(([name,v])=>({x:v.dates,y:v.equity.map(x=>x*10000),type:'scatter',mode:'lines',name}));Plotly.newPlot('chart',traces,{paper_bgcolor:'#151f30',plot_bgcolor:'#151f30',font:{color:'#dbe7f7'},xaxis:{gridcolor:'#27354b'},yaxis:{gridcolor:'#27354b',tickprefix:'$'},margin:{t:15,l:75,r:20,b:50}},{responsive:true});document.querySelector('#results tbody').innerHTML=data.summary.filter(x=>x.ticker===t).map(x=>'<tr><td>'+x.strategy+'</td><td>'+pct(x.total_return)+'</td><td>'+pct(x.annualized_return)+'</td><td>'+pct(x.volatility)+'</td><td>'+x.sharpe_0rf.toFixed(2)+'</td><td>'+pct(x.max_drawdown)+'</td><td>'+pct(x.win_rate)+'</td></tr>').join('')}
fetch('data/results.json').then(r=>{if(!r.ok)throw Error('Results not yet generated');return r.json()}).then(d=>{data=d;let s=document.querySelector('#ticker');Object.keys(d.series).forEach(t=>s.add(new Option(t,t)));s.onchange=render;document.querySelector('#meta').textContent='Updated '+d.generated_at.slice(0,10)+' · '+d.cost_bps+' bps per side';document.querySelector('#errors').textContent=Object.entries(d.errors).map(([t,e])=>t+': '+e).join(' | ');render()}).catch(e=>document.querySelector('#chart').textContent='Backtest results unavailable: '+e.message+'. Trigger the GitHub Actions workflow.');
</script></body></html>
